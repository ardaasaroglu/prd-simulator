name: Idea
description: Suggest a change before writing code.
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: A new seat, finding type or report section changes the method for everyone. Describe the problem first, so it can be discussed before anyone writes a prompt.
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What did the simulator miss, get wrong, or make hard? An example on a fictional spec helps most.
    validations:
      required: true
  - type: textarea
    id: change
    attributes:
      label: What you would change
