name: Bug report
description: The simulator did something the README says it should not, or failed to run.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Do not paste a confidential spec, a report about one, an API key or a token. Reproduce the problem on one of the example specs, or on a short fictional spec, if you can. For a security problem, use the security policy instead of an issue.
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: The command you ran, what you expected and what you saw.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Versions
      description: Output of `claude --version`, the plugin version, and your OS.
      placeholder: 2.1.295 (Claude Code), prd-simulator 0.1.0, macOS 15
    validations:
      required: true
  - type: dropdown
    id: mode
    attributes:
      label: Run mode in the report header
      options:
        - parallel subagents
        - parallel, general-purpose fallback
        - sequential fallback
        - no report was written
    validations:
      required: true
  - type: textarea
    id: excerpt
    attributes:
      label: Report or transcript excerpt
      description: Only from a fictional or example spec.
      render: markdown
