name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A newer push to the same branch or pull request cancels the run it replaces.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Tests
        run: npm test
      # Validation reads local files only. It needs no login and no API key.
      - name: Install Claude Code (pinned)
        run: npm install -g @anthropic-ai/claude-code@2.1.295
      - name: Validate plugin and marketplace
        run: claude plugin validate . --strict
